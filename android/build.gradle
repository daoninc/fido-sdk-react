// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Some libraries (react-native-gesture-handler, react-native-screens) shell
// out to `node` to resolve the react-native package location as a fallback
// for monorepo setups. Android Studio launches Gradle without inheriting the
// shell's PATH, so `node` may not be found there even though `npm run
// android` works fine from a terminal. Setting this directly avoids the
// node subprocess call altogether.
ext.REACT_NATIVE_NODE_MODULES_DIR = file("../node_modules/react-native")
